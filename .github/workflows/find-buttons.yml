name: Find button code
on: workflow_dispatch
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Esp32Board.cpp
        run: cat -n src/hal/Esp32Board.cpp | head -200
      - name: Other uses of button pins
        run: |
          grep -rnE "btnLeft|btnSelect|btnRight|digitalRead|ext0|ext1|esp_sleep_enable|gpio_wakeup" \
            src --include=*.cpp --include=*.h | grep -v "platform/linux\|platform/tc002"
